      - "keith.murray@bernsteinsg.com"
    keywords:
      - "WEEKLY TECH CHECK"

  - name: "Wolfe Zukin's Next Week"
    senders:
      - "zukinteam@wolferesearch.com"
    keywords:
      - "Zukin's Next Week"
    exclude_keywords:
      - "IN ONE HOUR"
      - "STARTING IN"

  - name: "Wolfe Software Sunday"
    senders:
      - "azukin@wolferesearch.com"
