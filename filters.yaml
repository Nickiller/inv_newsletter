      - "Software Weekly Sunday"

  - name: "Wolfe Internet Week Ahead"
    senders:
      - "skhajuria@wolferesearch.com"
    keywords:
      - "Week Ahead"

  - name: "Jefferies Tech Sunday Scoreboard"
    senders:
