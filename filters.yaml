  - name: "Meritco Weekly Digest"
    senders:
      - "forum@research.meritco-group.com"
    keywords:
      - "近一周"
      - "调研周报"

# 总结配置
summarization:
  model: "claude-opus-4-7"
  max_tokens: 32000
  output_dir: "./output/daily"
  lark_folder_token: "VnpGfdTuylfRcJdFmGkct1Q1nqg"  # 飞书目标文件夹
  sectors:
    - "AI 模型与平台"
    - "宏观与市场"
    - "半导体与硬件"
    - "互联网与数字广告"
    - "软件与SaaS"
    - "网络安全"
    - "其他"

# 社交媒体追踪配置
social:
  twitter:
    enabled: true
    accounts:
      - handle: "karpathy"
        name: "Andrej Karpathy"
    hours_back: 24
    include_replies: false
    include_retweets: false
  truth_social:
    enabled: true
    accounts:
      - handle: "realDonaldTrump"
        name: "Donald Trump"
    hours_back: 24

# 自动监控配置
monitor:
  start_hour: 20          # CST 晚8点开始扫描
  deadline_hour: 23       # CST 晚11点截止，强制总结
  weekday_min_sources: 2  # 工作日最少来源数
  weekend_min_sources: 1  # 周末最少来源数
  grace_minutes: 45       # 达到阈值后等待时间（分钟）
  timezone: "Asia/Shanghai"
