      - "Jefferies Tech"

  - name: "Jefferies While You Were Sleeping"
    # 转发自 shuang@etnalabs.co，原发件人 comara@jefferies.com
    senders:
      - "shuang@etnalabs.co"
    keywords:
      - "While You Were Sleeping"

  - name: "Bernstein TMT"
    senders:
      - "tyler.seidman@bernsteinsg.com"
    keywords:
      - "Bernstein TMT"

  - name: "FOMO Therapy"
    senders:
      - "no-reply@notifications.alphaholic.app"
      - "zezhou@notifications.alphaholic.app"
    keywords:
      - "FOMO Therapy"

  - name: "Wolfe Internet"
    senders:
      - "skhajuria@wolferesearch.com"
