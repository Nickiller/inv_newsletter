# Daily 必读邮件筛选配置
# 每个 filter group: 发件人 + 主题关键词组合

hours_back: 72

filters:
  - name: "JPM Tech Sketch"
    senders:
      - "mark.schilsky@jpmorgan.com"
    keywords:
      - "JPM TECH SKETCH"

  - name: "Jefferies Tech"
    senders:
      - "jfavuzza@jefferies.com"
    keywords:
      - "Jefferies Tech"

  - name: "Bernstein TMT"
    senders:
      - "tyler.seidman@bernsteinsg.com"
    keywords:
      - "Bernstein TMT"

  - name: "FOMO Therapy"
    senders:
      - "no-reply@notifications.alphaholic.app"
      - "zezhou@notifications.alphaholic.app"
    keywords:
      - "FOMO Therapy"

  - name: "Wolfe Internet"
    senders:
      - "skhajuria@wolferesearch.com"
    keywords:
      - "Internet"

  - name: "JPM Semis"
    senders:
      - "joshua.meyers@jpmorgan.com"
    keywords:
      - "Chips for Breakfast"

# 总结配置
summarization:
  model: "claude-sonnet-4-6"
  max_tokens: 8192
  output_dir: "./output/daily"
  sectors:
    - "宏观与市场"
    - "AI 模型与平台"
    - "半导体与硬件"
    - "互联网与数字广告"
    - "软件与SaaS"
    - "网络安全"
    - "其他"

# 自动监控配置
monitor:
  start_hour: 20          # CST 晚8点开始扫描
  deadline_hour: 23       # CST 晚11点截止，强制总结
  weekday_min_sources: 2  # 工作日最少来源数
  weekend_min_sources: 1  # 周末最少来源数
  grace_minutes: 45       # 达到阈值后等待时间（分钟）
  timezone: "Asia/Shanghai"
