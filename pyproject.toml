[project]
name = "inv-newsletter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.31.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.14.0",
    "anthropic>=0.42.0",
    "twikit>=2.0.0",
    "truthbrush>=0.5.0",
    "pycryptodome>=3.21.0",
]

[project.scripts]
inv-newsletter = "inv_newsletter.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
