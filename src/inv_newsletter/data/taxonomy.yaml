# Sector / Industry / Ticker 分类权威表（single source of truth）
#
# 设计原则：
# - YAML 中的出现顺序 = digest 中的 canonical display order（sector 和 industry 都是）
# - 每个 ticker 一个 primary sector/industry。LLM 仍可在其他 section 引用该 ticker（如
#   GOOGL 主分类为互联网，但在 AI 模型与平台讨论 Gemini 时可被提及），post-process 不
#   把这种跨 section 提及当作 drift（只 log 不阻断）。
# - 边界决策记录在 `notes` 字段，避免下次又靠记忆判断。
# - 添加新 ticker 时只需在对应 industry 下追加一行；新 industry 在对应 sector 内追加；
#   新 sector 调整顶层顺序即可。

version: 1

sectors:
  # ─────────────────────────────────────────────────────────────────────────
  - name: AI 模型与平台
    description: 基础模型实验室、AI Coding/Agent、AI infra 平台层
    industries:
      - name: Foundation Models
        description: 主营即前沿大模型的实验室 / 公司。Hyperscaler 的 AI 部门（GOOGL/META/MSFT/BABA）归其主营 sector，AI 主题通过 aliases (Gemini/Llama/Copilot/Qwen) 触发命中。
        tickers:
          - { ticker: ANTH, company: Anthropic, aliases: [Claude] }
          - { ticker: OAI, company: OpenAI, aliases: [ChatGPT, GPT] }
          - { ticker: DEEPSEEK, company: DeepSeek, aliases: [深度求索] }
          - { ticker: XAI, company: xAI, aliases: [Grok] }
          - {
              ticker: BYTEDANCE,
              company: ByteDance,
              aliases: [字节跳动, 字节, Doubao, 豆包, SeeDance],
            }

      - name: AI Coding / Agent
        description: AI 编程与 Agent 框架（独立创业公司或产品维度）
        tickers:
          - { ticker: CURSOR, company: Cursor (Anysphere) }
          - { ticker: WINDSURF, company: Windsurf (Codeium) }
          - { ticker: REPLIT, company: Replit }

  # ─────────────────────────────────────────────────────────────────────────
  - name: 宏观与市场
    description: 宏观数据、利率/汇率/大宗、指数/板块 ETF/大盘技术面、Factor / Momentum / Rotation、仓位/资金流/Sentiment、地缘/政策/关税、加密宏观、IPO/一级市场。允许 theme-led `### XXX` 标题，不必每条都有 ticker。
    industries:
      - name: 指数 / 板块 ETF / 大盘技术面
        description: 大盘指数、板块 ETF、跨市场技术面（成交量、HSD/LDD 名单、52 周高位分布、隔夜亚洲）
        tickers:
          - { ticker: SOXX, company: iShares 半导体 ETF }
          - { ticker: IGV, company: iShares 软件 ETF }
          - { ticker: SMH, company: VanEck 半导体 ETF }
          - { ticker: KOSPI, company: 韩国综合指数 }
          - { ticker: NDX, company: 纳斯达克 100 }
          - { ticker: SPX, company: S&P 500 }
          - { ticker: VIX, company: 波动率指数 }

      - name: 利率 / 汇率 / 大宗
        description: 10/30 年期收益率、美元 / JPY / CNY、原油、铜、黄金、稀土等大宗商品价格与影响
        tickers: []

      - name: Factor / Momentum / Rotation
        description: Tech Momentum factor、板块轮动（Software vs Semis、Infra+Cyber > Apps）、cross-sector factor unwind、行业内 leadership 变化
        tickers: []

      - name: 仓位 / 资金流 / Sentiment
        description: HF positioning（JPM Sentiment Matrix、Goldman Prime Book）、ETF 资金流、long/short crowding、buyside positioning 评分
        tickers: []

      - name: 地缘 / 政策 / 关税
        description: 关税与豁免、出口管制、制裁（如 Iran/俄罗斯）、中美会谈、国内补贴政策（IRA、半导体法案）
        tickers: []

      - name: 加密与数字资产宏观
        description: 加密资产宏观叙事（个股标的 COIN/HOOD 归 互联网/Fintech；MSTR/CRCL 归 互联网/Fintech）
        tickers:
          - { ticker: BTC, company: Bitcoin }
          - { ticker: ETH, company: Ethereum }

      - name: IPO / 一级市场
        description: 准上市公司与一级市场（SpaceX、Cerebras、Klarna 等）、即将上市定价节奏、私募估值轮变化
        tickers: []

